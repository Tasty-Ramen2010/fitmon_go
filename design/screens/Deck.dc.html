<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Battle deck</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..800&amp;family=Nunito:wght@500;600;700;800;900&amp;family=Caveat:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#FFF8EE}

</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #FFF8EE; color: #22203A; font-family: 'Nunito', system-ui, sans-serif; padding: 20px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><a href="Dex.dc.html" aria-label="Back to FitDex" style="flex-shrink: 0; width: 46px; height: 46px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #EADFCF; box-shadow: 0 3px 0 #EADFCF; display: flex; align-items: center; justify-content: center; color: #22203A; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: #22203A; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M15 5l-7 7 7 7"></path></svg></a><div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 26px; line-height: 1.05; font-weight: 700; font-family: 'Fraunces', Georgia, serif">Battle deck</span><span style="font-size: 13px; font-weight: 600; color: #6E6878">The moves you take into every fight</span></div><span style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1"><span style="font-size: 24px; font-weight: 700; font-family: 'Fraunces', Georgia, serif">{{power}}</span><span style="font-size: 11px; font-weight: 800; color: #6E6878">deck power</span></span></div>

</div>
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px"><span style="font-size: 20px; font-weight: 700; font-family: 'Fraunces', Georgia, serif">Your moves</span><span style="font-size: 12px; font-weight: 800; color: #6E6878">Swapping slot {{slotNum}}: {{slotName}}</span></div>
<div style="height: 318px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; scrollbar-width: none">
<sc-for list="{{lib}}" as="m" hint-placeholder-count="5">
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px; border-radius: 20px; background: #FFFFFF; border: 2px solid #EFE4D3; box-shadow: 0 3px 0 #EADFCF">
<span style="flex-shrink: 0; width: 38px; height: 38px; box-sizing: border-box; border-radius: {{m.shape}}; background: {{m.fill}}; border: 2px solid {{m.mark}}; display: flex; align-items: center; justify-content: center; color: {{m.mark}}"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="{{m.icon}}"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 14px; font-weight: 900">{{m.name}}</span><span style="font-size: 11px; font-weight: 700; color: #6E6878; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.eff}} · <span style="color: {{m.text}}; font-weight: 800">{{m.tier}}</span></span></span>
<sc-if value="{{m.canAdd}}" hint-placeholder-val="{{true}}"><button onClick="{{m.add}}" style="flex-shrink: 0; height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFCB47; box-shadow: 0 3px 0 #E0A51A; font-size: 13px; font-weight: 900; color: #22203A; cursor: pointer">Swap in</button></sc-if>
<sc-if value="{{m.inDeck}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 6px 10px; border-radius: 999px; background: #D6F3E2; color: #13784C; font-size: 12px; font-weight: 900"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: #13784C; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>In deck</span></sc-if>
</div>
</sc-for>
</div>
<a href="Battle.dc.html" style="height: 54px; box-sizing: border-box; border: 0; border-radius: 999px; background: #FFCB47; box-shadow: 0 5px 0 #E0A51A; color: #22203A; font-size: 17px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; text-decoration: none; "><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; fill: none; stroke: #22203A; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Save deck</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const MOVES = [{"id": "planche", "name": "Planche Press", "src": "Planche", "r": "mythic", "icon": "M2 20h20M9 20v-6M9 14h13M4 14a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0", "eff": "90 dmg, can't be blocked", "power": 90}, {"id": "pistol", "name": "Pistol Stomp", "src": "Pistol Squat", "r": "epic", "icon": "M10 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6.5l-2 5.5h6l-1 8M12 8.5h7M4 20h16", "eff": "70 dmg, slows the opponent", "power": 70}, {"id": "lsit", "name": "L-sit Lock", "src": "L-sit", "r": "epic", "icon": "M5 5v8M5 13h13M3 13h4M10.4 5a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0M12 7v6", "eff": "Blocks the next hit", "power": 45}, {"id": "pullups", "name": "Pull Through", "src": "Pull-ups", "r": "rare", "icon": "M3 3h18M8 3l2 6M16 3l-2 6M10.5 7.5a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M12 9.5V16M12 16l-2 5M12 16l2 5", "eff": "55 dmg, always goes first", "power": 55}, {"id": "diamond", "name": "Diamond Jab", "src": "Diamond Push-ups", "r": "rare", "icon": "M2 10a2 2 0 1 0 4 0a2 2 0 1 0-4 0M6.5 11l14.5 4M9 11.8V18M21 15v3M2 20h20", "eff": "2 hits of 28 dmg", "power": 2}, {"id": "tuck", "name": "Tuck Spin", "src": "Tuck Lever", "r": "rare", "icon": "M2 3h9M6.5 3v6M6.5 9H22M2.4 9a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0", "eff": "40 dmg, dodge the next hit", "power": 40}, {"id": "chinups", "name": "Chin Check", "src": "Chin-ups", "r": "rare", "icon": "M3 3h18M8 3l2 6M16 3l-2 6M10.5 7.5a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M12 9.5V16M12 16l-2 5M12 16l2 5", "eff": "45 dmg", "power": 45}, {"id": "burpees", "name": "Burpee Blast", "src": "Burpees", "r": "uncommon", "icon": "M10 3a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6v7M12 7l-5-3M12 7l5-3M12 13l-3 6M12 13l3 6M4 22h16", "eff": "35 dmg, heal 20", "power": 35}, {"id": "climbers", "name": "Second Wind", "src": "Mountain Climbers", "r": "uncommon", "icon": "M14 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M15 7l-3 5 4 3-1 6M12 12l-5 1M15 7l3 4 3-1M12 12l-2 5-5 1", "eff": "Heal 80, 2 uses", "power": 45}, {"id": "dips", "name": "Dip Drop", "src": "Dips", "r": "uncommon", "icon": "M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11", "eff": "30 dmg", "power": 30}, {"id": "jumpsq", "name": "Jump Stomp", "src": "Jump Squats", "r": "uncommon", "icon": "M10 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6.5l-2 5.5h6l-1 8M12 8.5h7M4 20h16", "eff": "32 dmg", "power": 32}, {"id": "stepups", "name": "Step Kick", "src": "Step-ups", "r": "uncommon", "icon": "M11 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M13 7l-1 6 3 3v5M12 13l-3 8M13 8l-4 3M13 8l4 3", "eff": "28 dmg", "power": 28}, {"id": "boxjumps", "name": "Box Bounce", "src": "Box Jumps", "r": "uncommon", "icon": "M10 3a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6v7M12 7l-5-3M12 7l5-3M12 13l-3 6M12 13l3 6M4 22h16", "eff": "30 dmg, hits first", "power": 30}, {"id": "wallsit", "name": "Wall Brace", "src": "Wall Sit", "r": "uncommon", "icon": "M10 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6.5l-2 5.5h6l-1 8M12 8.5h7M4 20h16", "eff": "Take 25% less", "power": 45}, {"id": "pushups", "name": "Power Push", "src": "Push-ups", "r": "common", "icon": "M2 10a2 2 0 1 0 4 0a2 2 0 1 0-4 0M6.5 11l14.5 4M9 11.8V18M21 15v3M2 20h20", "eff": "60 dmg", "power": 60}, {"id": "running", "name": "Tempo Dash", "src": "Running", "r": "common", "icon": "M14 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M15 7l-3 5 4 3-1 6M12 12l-5 1M15 7l3 4 3-1M12 12l-2 5-5 1", "eff": "25 dmg, hits first", "power": 25}, {"id": "plank", "name": "Core Brace", "src": "Plank", "r": "common", "icon": "M2 10a2 2 0 1 0 4 0a2 2 0 1 0-4 0M6.5 11l14.5 4M9 11.8V18M21 15v3M2 20h20", "eff": "Take 40% less", "power": 45}, {"id": "squats", "name": "Squat Slam", "src": "Squats", "r": "common", "icon": "M10 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6.5l-2 5.5h6l-1 8M12 8.5h7M4 20h16", "eff": "30 dmg", "power": 30}, {"id": "lunges", "name": "Lunge Strike", "src": "Lunges", "r": "common", "icon": "M11 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M13 7l-1 6 3 3v5M12 13l-3 8M13 8l-4 3M13 8l4 3", "eff": "26 dmg", "power": 26}, {"id": "situps", "name": "Crunch Kick", "src": "Sit-ups", "r": "common", "icon": "M10 3a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6v7M12 7l-5-3M12 7l5-3M12 13l-3 6M12 13l3 6M4 22h16", "eff": "24 dmg", "power": 24}, {"id": "jacks", "name": "Jack Jab", "src": "Jumping Jacks", "r": "common", "icon": "M10 3a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6v7M12 7l-5-3M12 7l5-3M12 13l-3 6M12 13l3 6M4 22h16", "eff": "20 dmg", "power": 20}, {"id": "calves", "name": "Heel Tap", "src": "Calf Raises", "r": "common", "icon": "M11 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M13 7l-1 6 3 3v5M12 13l-3 8M13 8l-4 3M13 8l4 3", "eff": "18 dmg", "power": 18}, {"id": "bridge", "name": "Bridge Buck", "src": "Glute Bridge", "r": "common", "icon": "M10 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6.5l-2 5.5h6l-1 8M12 8.5h7M4 20h16", "eff": "22 dmg", "power": 22}];
const RAR = {"common": {"name": "Common", "mark": "#4C5B7C", "text": "#4C5B7C", "fill": "#E9EDF5"}, "uncommon": {"name": "Uncommon", "mark": "#1A9A63", "text": "#13784C", "fill": "#DBF4E7"}, "rare": {"name": "Rare", "mark": "#1B4AAE", "text": "#1B4AAE", "fill": "#DFE8FB"}, "epic": {"name": "Epic", "mark": "#A673F7", "text": "#7B3FD0", "fill": "#EEE4FF"}, "legendary": {"name": "Legendary", "mark": "#8F4A00", "text": "#8F4A00", "fill": "#FFE9C2"}, "mythic": {"name": "Mythic", "mark": "#E04A7E", "text": "#C0305F", "fill": "#FFE0EA"}, "mission": {"name": "Mission", "mark": "#FF7A59", "text": "#B8431F", "fill": "#FFE4DA"}};
const SHAPES = ["58% 42% 55% 45% / 52% 58% 42% 48%", "45% 55% 42% 58% / 55% 45% 55% 45%", "52% 48% 60% 40% / 45% 55% 45% 55%", "62% 38% 46% 54% / 48% 52% 48% 52%"];
const byId = {};
MOVES.forEach((m) => { byId[m.id] = m; });
const st = this.state || {};
const deck = st.deck || ['pushups', 'running', 'plank', 'climbers'];
const slot = st.slot === undefined ? 1 : st.slot;
const dress = (m, i) => { const c = RAR[m.r]; return Object.assign({}, m, { fill: c.fill, mark: c.mark, text: c.text, tier: c.name, shape: SHAPES[i % 4] }); };
const slots = deck.map((id, i) => Object.assign(dress(byId[id], i), {
  num: i + 1, border: i === slot ? '3px solid #FF7A59' : '2px solid #EFE4D3', edge: i === slot ? '#E0673F' : '#EADFCF', isSel: i === slot,
  pick: () => this.setState({ deck: deck, slot: i }) }));
const lib = MOVES.filter((m) => m.r !== 'common' || deck.indexOf(m.id) >= 0 || m.id === 'squats').map((m, i) => {
  const inDeck = deck.indexOf(m.id) >= 0;
  return Object.assign(dress(m, i), { inDeck: inDeck, canAdd: !inDeck,
    add: () => { if (inDeck) return; const d = deck.slice(); d[slot] = m.id; this.setState({ deck: d, slot: slot }); } });
});
const power = deck.reduce((a, id) => a + byId[id].power, 0) + 220;
return { slots: slots, lib: lib, power: power, slotNum: slot + 1, slotName: byId[deck[slot]].name };
}
}
</script>
