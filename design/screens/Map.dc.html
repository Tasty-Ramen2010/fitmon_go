<script type="text/x-dc" data-dc-script data-props='{"heading": {"editor": "range", "min": 0, "max": 355, "step": 5, "unit": "°", "default": 0, "section": "Player"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const heading = Number(this.props.heading ?? 0);
const rot = -heading * Math.PI / 180;
const tilt = 50 * Math.PI / 180, d = 1800, ox = 195, oy = 600;
const ICON = {"pushup": "M2 10a2 2 0 1 0 4 0a2 2 0 1 0-4 0M6.5 11l14.5 4M9 11.8V18M21 15v3M2 20h20", "squat": "M10 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6.5l-2 5.5h6l-1 8M12 8.5h7M4 20h16", "pullup": "M3 3h18M8 3l2 6M16 3l-2 6M10.5 7.5a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M12 9.5V16M12 16l-2 5M12 16l2 5", "frontlever": "M2 3h9M6.5 3v6M6.5 9H22M2.4 9a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0", "muscleup": "M3 13h18M8.5 13l1.5-5M15.5 13L14 8M10 8h4M12 8v8M12 16l-2 5M12 16l2 5M10.4 4.5a1.6 1.6 0 1 0 3.2 0a1.6 1.6 0 1 0-3.2 0", "run": "M14 4a2 2 0 1 0 4 0a2 2 0 1 0-4 0M15 7l-3 5 4 3-1 6M12 12l-5 1M15 7l3 4 3-1M12 12l-2 5-5 1", "burpee": "M10 3a2 2 0 1 0 4 0a2 2 0 1 0-4 0M12 6v7M12 7l-5-3M12 7l5-3M12 13l-3 6M12 13l3 6M4 22h16"};
const RAR = {"common": {"name": "Common", "mark": "#4C5B7C", "text": "#4C5B7C", "fill": "#E9EDF5"}, "uncommon": {"name": "Uncommon", "mark": "#1A9A63", "text": "#13784C", "fill": "#DBF4E7"}, "rare": {"name": "Rare", "mark": "#1B4AAE", "text": "#1B4AAE", "fill": "#DFE8FB"}, "epic": {"name": "Epic", "mark": "#A673F7", "text": "#7B3FD0", "fill": "#EEE4FF"}, "legendary": {"name": "Legendary", "mark": "#8F4A00", "text": "#8F4A00", "fill": "#FFE9C2"}, "mythic": {"name": "Mythic", "mark": "#E04A7E", "text": "#C0305F", "fill": "#FFE0EA"}, "mission": {"name": "Mission", "mark": "#FF7A59", "text": "#B8431F", "fill": "#FFE4DA"}};
const SHAPES = ["58% 42% 55% 45% / 52% 58% 42% 48%", "45% 55% 42% 58% / 55% 45% 55% 45%", "52% 48% 60% 40% / 45% 55% 45% 55%", "62% 38% 46% 54% / 48% 52% 48% 52%"];
const proj = (wx, wy) => {
  const xr = wx * Math.cos(rot) - wy * Math.sin(rot);
  const yr = wx * Math.sin(rot) + wy * Math.cos(rot);
  const z = yr * Math.sin(tilt);
  const s = d / (d - z);
  return { x: Math.round(ox + xr * s), y: Math.round(oy + yr * Math.cos(tilt) * s), s: Math.round(s * 1000) / 1000 };
};
const onScreen = (q) => q.y > 110 && q.y < 585 && q.x > 24 && q.x < 366;
const raw = [
  { label: 'Push-ups ×20', r: 'common', icon: 'pushup', wx: -140, wy: -200 },
  { label: 'Pull-ups ×8', r: 'rare', icon: 'pullup', wx: -100, wy: -420 },
  { label: 'Front Lever', r: 'mythic', icon: 'frontlever', wx: -40, wy: -720 },
  { label: 'Squats ×25', r: 'common', icon: 'squat', wx: 300, wy: 40 },
  { label: 'Pistol Squat', r: 'epic', icon: 'squat', wx: 820, wy: 120 },
  { label: 'Burpees ×15', r: 'uncommon', icon: 'burpee', wx: -300, wy: -40 },
  { label: 'Pull-ups ×8', r: 'rare', icon: 'pullup', wx: -850, wy: -60 },
  { label: 'Push-ups ×20', r: 'common', icon: 'pushup', wx: -60, wy: 320 },
  { label: 'Muscle-up ×3', r: 'legendary', icon: 'muscleup', wx: -150, wy: 900 }
];
const spawns = raw.map((p, i) => {
  const q = proj(p.wx, p.wy);
  const c = RAR[p.r];
  return { label: p.label, tier: c.name, mark: c.mark, text: c.text, fill: c.fill, shape: SHAPES[i % 4], icon: ICON[p.icon],
    x: q.x, y: q.y, s: q.s, sparkle: p.r === 'mythic' || p.r === 'legendary' };
}).filter(onScreen).sort((a, b) => a.y - b.y);
const g = proj(-180, -1000);
const t = proj(150, -560);
return { worldRot: -heading, spawns: spawns, gym: g, showGym: onScreen(g), rival: t, showRival: onScreen(t) };
}
